<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>anime-style · minimal</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111}</style>
</head>
<body>
<script type="module">
// The smallest complete use of the engine: style + stage + your own meshes.
import * as THREE from 'three';
import { AnimeStyle, AnimeStage } from 'anime-style';

const q = new URLSearchParams(location.search);
const style = new AnimeStyle(q.get('preset') || 'skyPop');
const stage = new AnimeStage({ style, container: document.body });

// 1) any geometry + style.stylize() = cel material + tinted outline
const world = new THREE.Group();
stage.scene.add(world);
const add = (geo, color, pos, kind = 'prop') => {
  const m = style.stylize(new THREE.Mesh(geo), { kind, color });
  m.position.set(...pos);
  world.add(m);
  return m;
};
add(new THREE.BoxGeometry(1.6, 0.4, 1.0).translate(0, 0.2, 0), '#62b2f8', [0, 0, 0]);
add(new THREE.SphereGeometry(0.18, 48, 32), '#ffd166', [0, 0.58, 0]);
add(new THREE.CylinderGeometry(0.12, 0.14, 0.32, 48), '#ef476f', [0.45, 0.56, 0.05]);
add(new THREE.ConeGeometry(0.14, 0.34, 48), '#ffffff', [-0.42, 0.57, 0.1]);
add(new THREE.TorusGeometry(0.11, 0.045, 24, 64), '#26547c', [0.12, 0.46, 0.38]).rotation.x = Math.PI / 2;

// 2) or convert an existing scene (e.g. a loaded glTF) in one call
const standard = new THREE.Mesh(new THREE.TorusKnotGeometry(0.1, 0.035, 128, 24), new THREE.MeshStandardMaterial({ color: '#7bdff2' }));
standard.position.set(-0.15, 0.62, 0.42);
world.add(standard);
style.applyTo(standard);

stage.frameObject(world, { yaw: 30, pitch: 14, fill: 0.5, anchor: 0.55, fov: 24 });
stage.render(0);
window.__ready = true;
if (!q.has('capture')) stage.start();
</script>
</body>
</html>
